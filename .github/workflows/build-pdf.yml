name: Build PDF

on:
  push:
    paths:
      - 'documentation/idea.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-recommended texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-xetex

      - name: Download eisvogel template
        run: |
          mkdir -p ~/.local/share/pandoc/templates
          curl -sSL https://raw.githubusercontent.com/enhuiz/eisvogel/a0a62623802e5f92474d2ebe125b49a91ddacc6a/eisvogel.tex \
            -o ~/.local/share/pandoc/templates/eisvogel.latex

      - name: Convert idea.md to idea.pdf
        run: |
          pandoc documentation/idea.md \
            -o documentation/idea.pdf \
            --from markdown \
            --template eisvogel \
            --listings

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: idea-pdf
          path: documentation/idea.pdf
