name: Build PDF

on:
  push:
    paths:
      - 'documentation/idea.md'
      - 'documentation/ase2026.md'
      - 'documentation/templates/ieee-conference/**'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-recommended texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-xetex

      - name: Download eisvogel template
        run: |
          mkdir -p ~/.local/share/pandoc/templates
          curl -sSL https://github.com/Wandmalfarbe/pandoc-latex-template/releases/download/v3.4.0/Eisvogel-3.4.0.tar.gz \
            -o /tmp/eisvogel.tar.gz
          tar -xzf /tmp/eisvogel.tar.gz -C /tmp/
          find /tmp -name 'eisvogel.latex' | head -1 | xargs -I{} cp {} ~/.local/share/pandoc/templates/eisvogel.latex

      - name: Convert idea.md to idea.pdf
        run: |
          pandoc documentation/idea.md \
            -o documentation/idea.pdf \
            --from markdown \
            --template eisvogel \
            --pdf-engine=xelatex

      - name: Convert ase2026.md to ase2026.tex (IEEE conference)
        run: |
          TEXINPUTS=documentation/templates/ieee-conference//: \
          pandoc documentation/ase2026.md \
            --from markdown \
            --to latex \
            --standalone \
            -V documentclass=IEEEtran \
            -V classoption=conference \
            -o documentation/ase2026.tex

      - name: Convert ase2026.tex to ase2026.pdf (IEEE conference)
        run: |
          TEXINPUTS=documentation/templates/ieee-conference//: \
          xelatex -interaction=nonstopmode -halt-on-error \
            -output-directory documentation \
            documentation/ase2026.tex

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add documentation/idea.pdf documentation/ase2026.tex documentation/ase2026.pdf
          git diff --staged --quiet || (git commit -m "docs: update generated PDFs [skip ci]" && git push)
