name: Build PDF

on:
  push:
    paths:
      - 'documentation/idea.md'
      - 'documentation/ase2026.md'
      - 'documentation/templates/ieee-conference/**'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Artifact channel'
        required: true
        default: 'wip'
        type: choice
        options:
          - wip
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-recommended texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-xetex

      - name: Download eisvogel template
        run: |
          mkdir -p ~/.local/share/pandoc/templates
          curl -sSL https://github.com/Wandmalfarbe/pandoc-latex-template/releases/download/v3.4.0/Eisvogel-3.4.0.tar.gz \
            -o /tmp/eisvogel.tar.gz
          tar -xzf /tmp/eisvogel.tar.gz -C /tmp/
          find /tmp -name 'eisvogel.latex' | head -1 | xargs -I{} cp {} ~/.local/share/pandoc/templates/eisvogel.latex

      - name: Convert idea.md to idea.pdf
        run: |
          pandoc documentation/idea.md \
            -o documentation/idea.pdf \
            --from markdown \
            --template eisvogel \
            --pdf-engine=xelatex

      - name: Convert ase2026.md directly to ase2026.pdf (IEEE conference)
        run: |
          TEXINPUTS=documentation/templates/ieee-conference//: \
          pandoc documentation/ase2026.md \
            --from markdown-smart \
            --pdf-engine=xelatex \
            -V documentclass=IEEEtran \
            -V classoption=conference \
            --template documentation/templates/ieee-conference/ieee-paper.latex \
            -o documentation/ase2026.pdf

      - name: Prepare artifact metadata
        id: meta
        run: |
          DATE_UTC="$(date -u +%Y%m%d)"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          CHANNEL="wip"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            CHANNEL="release"
          fi

          if [ "$CHANNEL" = "release" ]; then
            ARTIFACT_NAME="release-${DATE_UTC}-${GITHUB_REF_NAME}"
          else
            ARTIFACT_NAME="wip-${DATE_UTC}-${SHORT_SHA}"
          fi

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "date_utc=${DATE_UTC}" >> "$GITHUB_OUTPUT"
          echo "suffix=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload idea PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: idea-${{ steps.meta.outputs.suffix }}
          path: documentation/idea.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload ase2026 PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ase2026-${{ steps.meta.outputs.suffix }}
          path: documentation/ase2026.pdf
          if-no-files-found: error
          retention-days: 30
