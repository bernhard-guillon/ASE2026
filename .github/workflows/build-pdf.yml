name: Build PDF

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'documentation/ase2026.md'
      - 'documentation/templates/ieee-conference/**'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-recommended texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-xetex

      - name: Convert ase2026.md directly to ase2026.pdf (IEEE conference)
        run: |
          TEXINPUTS=documentation/templates/ieee-conference//: \
          pandoc documentation/ase2026.md \
            --from markdown-smart \
            --lua-filter=documentation/pandoc-filters/ieee_table.lua \
            --pdf-engine=xelatex \
            -V documentclass=IEEEtran \
            -V classoption=conference \
            --template documentation/templates/ieee-conference/ieee-paper.latex \
            -o documentation/ase2026.pdf

      - name: Prepare release metadata
        id: meta
        run: |
          DATE_UTC="$(date -u +%Y%m%d)"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REF_NAME="${GITHUB_REF_NAME}"

          if [ "${REF_NAME}" = "main" ]; then
            TAG_NAME="ase2026-wip-${DATE_UTC}-${SHORT_SHA}"
            RELEASE_NAME="ASE2026 WIP ${DATE_UTC}"
            PRERELEASE="true"
            ASSET_NAME="ase2026-bernhard-guillon-wip-${DATE_UTC}.pdf"
          elif [[ "${REF_NAME}" == release/* ]]; then
            BRANCH_LABEL="${REF_NAME#release/}"
            TAG_SAFE="$(echo "${BRANCH_LABEL}" | tr '/ ' '--')"
            TAG_NAME="ase2026-${TAG_SAFE}-${DATE_UTC}-${SHORT_SHA}"
            RELEASE_NAME="ASE2026 ${BRANCH_LABEL} ${DATE_UTC}"
            PRERELEASE="false"
            ASSET_NAME="ase2026-bernhard-guillon-${DATE_UTC}.pdf"
          else
            echo "Unsupported branch: ${REF_NAME}"
            exit 1
          fi

          cp documentation/ase2026.pdf "documentation/${ASSET_NAME}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "asset_path=documentation/${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release with PDF asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: ${{ steps.meta.outputs.asset_path }}
