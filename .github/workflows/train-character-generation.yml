name: Train Character Generation Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '150'
        type: string
      batch_size:
        description: 'Batch size for training'
        required: false
        default: '8'
        type: string

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r projects/character-generation/requirements.txt

    - name: Run dataset generation and training
      run: |
        cd projects/character-generation/src
        python train.py ${{ inputs.epochs }} ${{ inputs.batch_size }}

    - name: Upload model artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trained-model
        path: |
          projects/character-generation/src/model.pth
          projects/character-generation/src/metrics.json
          projects/character-generation/src/char_map.json
          projects/character-generation/src/dataset.npz
        retention-days: 30

    - name: Upload debug character images
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: debug-characters
        path: projects/character-generation/src/debug_chars/
        retention-days: 7

    - name: Print training summary
      if: always()
      run: |
        echo "=== Training Job Summary ==="
        echo "Model saved: projects/character-generation/src/model.pth"
        echo "Metrics saved: projects/character-generation/src/metrics.json"
        echo "Character map: projects/character-generation/src/char_map.json"
        echo "Dataset saved: projects/character-generation/src/dataset.npz"
        if [ -f projects/character-generation/src/metrics.json ]; then
          echo ""
          echo "=== Final Metrics ==="
          tail -20 projects/character-generation/src/metrics.json
        fi
