<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <style>
    .node {
      fill: #4a90e2;
      stroke: #2c5aa0;
      stroke-width: 2;
    }
    .node.input { fill: #50c878; }
    .node.hidden { fill: #ff6b6b; }
    .node.output { fill: #ffd93d; }
    .arrow {
      stroke: #666;
      stroke-width: 1.5;
      fill: none;
    }
    .label {
      font-family: Arial, sans-serif;
      font-size: 13px;
      fill: #333;
      text-anchor: middle;
    }
    .title {
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      fill: #333;
      text-anchor: middle;
    }
    .math {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #333;
      text-anchor: start;
    }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" class="title">Multilayer Perceptron</text>
  
  <!-- Input Layer -->
  <circle cx="100" cy="100" r="20" class="node input"/>
  <text x="100" y="105" class="label">x1</text>
  
  <circle cx="100" cy="180" r="20" class="node input"/>
  <text x="100" y="185" class="label">x2</text>
  
  <circle cx="100" cy="260" r="20" class="node input"/>
  <text x="100" y="265" class="label">x3</text>
  
  <text x="100" y="350" class="label">Input Layer</text>
  
  <!-- Hidden Layer -->
  <circle cx="350" cy="150" r="20" class="node hidden"/>
  <text x="350" y="155" class="label">h1</text>
  
  <circle cx="350" cy="230" r="20" class="node hidden"/>
  <text x="350" y="235" class="label">h2</text>
  
  <text x="350" y="350" class="label">Hidden Layer</text>
  
  <!-- Output Layer -->
  <circle cx="600" cy="190" r="20" class="node output"/>
  <text x="600" y="195" class="label">y</text>
  
  <text x="600" y="350" class="label">Output Layer</text>
  
  <!-- Connections from input to hidden -->
  <line x1="120" y1="100" x2="330" y2="150" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="120" y1="100" x2="330" y2="230" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="120" y1="180" x2="330" y2="150" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="120" y1="180" x2="330" y2="230" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="120" y1="260" x2="330" y2="150" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="120" y1="260" x2="330" y2="230" class="arrow" marker-end="url(#arrowhead)"/>
  
  <!-- Connections from hidden to output -->
  <line x1="370" y1="150" x2="580" y2="190" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="230" x2="580" y2="190" class="arrow" marker-end="url(#arrowhead)"/>
  
  <!-- Math on right side -->
  <text x="750" y="90" class="math">z1 = w11*x1 + w12*x2 + w13*x3 + b1</text>
  <text x="750" y="115" class="math">h1 = ReLU(z1)</text>
  
  <text x="750" y="150" class="math">z2 = w21*x1 + w22*x2 + w23*x3 + b2</text>
  <text x="750" y="175" class="math">h2 = ReLU(z2)</text>
  
  <text x="750" y="210" class="math">z3 = w31*h1 + w32*h2 + b3</text>
  <text x="750" y="235" class="math">y = softmax(z3)</text>
  
  <!-- Activation labels -->
  <text x="950" y="115" class="math">ReLU</text>
  <text x="950" y="235" class="math">softmax</text>
</svg>
