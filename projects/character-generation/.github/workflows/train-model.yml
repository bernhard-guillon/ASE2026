name: Train Character Generation Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '150'
        type: string
      batch_size:
        description: 'Batch size for training'
        required: false
        default: '8'
        type: string

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run dataset generation and training
      run: |
        cd src
        python train.py ${{ inputs.epochs }} ${{ inputs.batch_size }}
    
    - name: Upload model artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trained-model
        path: |
          src/model.pth
          src/metrics.json
          src/char_map.json
          src/dataset.npz
        retention-days: 30
    
    - name: Print training summary
      if: always()
      run: |
        echo "=== Training Job Summary ==="
        echo "Model saved: src/model.pth"
        echo "Metrics saved: src/metrics.json"
        echo "Character map: src/char_map.json"
        echo "Dataset saved: src/dataset.npz"
        if [ -f src/metrics.json ]; then
          echo ""
          echo "=== Final Metrics ==="
          tail -20 src/metrics.json
        fi
